name: Enable GitHub Pages

# One-shot: the cloud-agent token cannot manage Pages settings.
# This job uses the repository GITHUB_TOKEN (pages: write) to set
# source = Deploy from a branch, branch = main, folder = /.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enable-pages.yml"
  workflow_dispatch:

permissions:
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Set Pages source to main /
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          code="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "${payload}" \
            "https://api.github.com/repos/${{ github.repository }}/pages")"
          echo "POST /pages -> ${code}"
          cat /tmp/pages.json
          echo
          if [ "${code}" != "201" ] && [ "${code}" != "200" ]; then
            code="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
              -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d "${payload}" \
              "https://api.github.com/repos/${{ github.repository }}/pages")"
            echo "PUT /pages -> ${code}"
            cat /tmp/pages.json
            echo
          fi
          case "${code}" in
            200|201) ;;
            *) exit 1 ;;
          esac
          curl -sS -o /tmp/repo.json -w 'PATCH repo -> %{http_code}\n' \
            -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"homepage":"https://khuang1019-hub.github.io/zhiti-yongli/","description":"企业智能体真实用例目录"}' \
            "https://api.github.com/repos/${{ github.repository }}" || true
          cat /tmp/repo.json || true
          echo
          curl -sS -o /tmp/build.json -w 'POST /pages/builds -> %{http_code}\n' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          cat /tmp/build.json || true
          echo
